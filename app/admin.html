<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>작업일보 · 관리자</title>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1E3A5F"/>
<meta name="apple-mobile-web-app-title" content="작업일보"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<style>
:root{
  --brand-1:#1E3A5F; --brand-2:#2E5F9E;
  --bg:#F0F4F8; --card:#fff; --card-bd:#D1DCE8; --ink:#1A2332; --lbl:#5A7A9A;
  --field-bg:#F7FAFC; --ok:#27AE60;
  --m-시공:#2E5F9E; --m-품질:#27AE60; --m-자재:#A0703A; --m-안전:#F39C12; --m-화기:#C0392B;
  --font-body:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"SFMono-Regular",Consolas,Menlo,monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100vh;}
.admin-wrap{max-width:1100px; margin:0 auto; padding:24px 20px 60px;}

.admin-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.admin-head h2{font-size:19px; font-weight:800; color:var(--brand-1); margin:0;}
.admin-head .proj{font-size:12px; color:var(--lbl);}
.admin-tabs{display:flex; gap:8px; margin-bottom:16px; border-bottom:2px solid var(--card-bd);}
.admin-tab{border:none; background:none; padding:10px 6px; font-size:14px; font-weight:700; color:var(--lbl); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; font-family:var(--font-body);}
.admin-tab.active{color:var(--brand-2); border-bottom-color:var(--brand-2);}
.admin-pane{display:none;}
.admin-pane.active{display:block;}

.proc-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px;}
.proc-card{background:var(--card); border:1px solid var(--card-bd); border-radius:10px; padding:14px;}
.proc-card .m{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px;}
.proc-card .pct{font-size:26px; font-weight:800; color:var(--ink); font-family:var(--font-mono);}
.proc-bar{height:6px; border-radius:3px; background:var(--field-bg); margin:8px 0; overflow:hidden;}
.proc-bar > div{height:100%; border-radius:3px;}
.proc-card .d{font-size:11px; color:var(--lbl);}

.dtable{width:100%; border-collapse:collapse; font-size:13px; background:var(--card); border:1px solid var(--card-bd); border-radius:10px; overflow:hidden;}
.dtable th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--lbl); background:var(--field-bg); padding:10px 12px; font-weight:700;}
.dtable td{padding:10px 12px; border-top:1px solid var(--card-bd); color:var(--ink);}
.dtable td.mono{font-family:var(--font-mono);}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
.pill-ok{background:#EAF7EE; color:var(--ok);}
.pill-draft{background:#FDF3E3; color:#B9770E;}
.pill-pdf{background:#EAF0F8; color:var(--brand-2); cursor:pointer; text-decoration:none;}

.out-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
.out-card{background:var(--card); border:1px solid var(--card-bd); border-radius:10px; padding:14px; text-align:center;}
.out-card .num{font-size:28px; font-weight:800; color:var(--brand-1); font-family:var(--font-mono);}
.out-card .lbl{font-size:11px; color:var(--lbl); margin-top:4px;}
</style>
</head>
<body>
<script src="../admin-gate.js"></script>
<div class="admin-wrap">
  <div class="admin-head">
    <div>
      <h2>작업일보 · 관리자</h2>
      <div class="proj" id="hdrProject" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">S-OIL SHAHEEN Project 계장공사 3공구(PKG-1)</div>
      <div class="proj" id="hdrCompany" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
    </div>
    <div style="font-size:12px;color:var(--lbl);" id="hdrDate"></div>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab active" onclick="showAdminTab(this,'proc')">공종별 공정률</button>
    <button class="admin-tab" onclick="showAdminTab(this,'out')">출력현황</button>
    <button class="admin-tab" onclick="showAdminTab(this,'reports')">작업일보 전체내용</button>
    <button class="admin-tab" onclick="showAdminTab(this,'cl')">Check List</button>
    <button class="admin-tab" onclick="showAdminTab(this,'members')">회원관리</button>
  </div>

  <!-- 공정률 -->
  <div class="admin-pane active" id="pane-proc">
    <div class="proc-grid" id="procGrid"><div style="grid-column:1/-1;text-align:center;color:var(--lbl);font-size:12px;padding:20px;">불러오는 중...</div></div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
      <button type="button" id="planSettingsBtn" onclick="openPlanSettings()" style="border:1px solid var(--card-bd);background:var(--card);color:var(--brand-2);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;">⚙️ 계획수량 설정</button>
    </div>
    <table class="dtable">
      <tr><th>작업분류</th><th>계획</th><th>전일누계</th><th>금일</th><th>누계</th><th>공정률</th></tr>
      <tbody id="procTableRows"><tr><td colspan="6" style="text-align:center;color:var(--lbl);">불러오는 중...</td></tr></tbody>
    </table>
  </div>

  <!-- 계획수량 설정 모달 — 웹관리자가 PC에서만 열 수 있고(⚙️ 버튼 자체를 모바일에선 숨김),
       여기 들어오기 전까지 표/카드는 항상 보여주기 전용이다 -->
  <div id="planModalOverlay" onclick="if(event.target===this) closePlanSettings()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9990;align-items:center;justify-content:center;">
    <div style="background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.3);margin:0 14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="font-size:16px;font-weight:800;color:var(--brand-1);margin:0;">계획수량 설정</h3>
        <button type="button" onclick="closePlanSettings()" style="border:none;background:var(--field-bg);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px;color:var(--lbl);">✕</button>
      </div>
      <label style="display:block;text-align:center;border:1.5px dashed var(--brand-2);background:var(--field-bg);color:var(--brand-2);border-radius:8px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:12px;">
        📤 엑셀로 일괄 입력(작업분류별 계획수량 업로드 서식)
        <input type="file" id="planExcelInput" accept=".xlsx,.xls" style="display:none;" onchange="handlePlanExcelUpload(this)">
      </label>
      <div id="planModalRows"></div>
      <button type="button" onclick="savePlanSettings()" style="width:100%;margin-top:14px;background:var(--brand-2);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;">저장</button>
    </div>
  </div>

  <!-- 출력현황 -->
  <div class="admin-pane" id="pane-out">
    <div style="background:var(--card); border:1px solid var(--card-bd); border-radius:10px; padding:14px; margin-bottom:16px;">
      <div style="font-size:13px;font-weight:800;color:var(--brand-1);margin-bottom:8px;">현장 좌표 설정 (작업자 앱 출력체크 반경 기준)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
        <div><label style="font-size:11px;color:var(--lbl);display:block;margin-bottom:2px;">위도</label><input type="number" step="any" id="siteLatInput" style="width:100%;padding:6px 8px;border:1px solid var(--card-bd);border-radius:6px;font-family:var(--font-mono);"></div>
        <div><label style="font-size:11px;color:var(--lbl);display:block;margin-bottom:2px;">경도</label><input type="number" step="any" id="siteLngInput" style="width:100%;padding:6px 8px;border:1px solid var(--card-bd);border-radius:6px;font-family:var(--font-mono);"></div>
        <div><label style="font-size:11px;color:var(--lbl);display:block;margin-bottom:2px;">반경(m)</label><input type="number" id="geofenceInput" value="1000" style="width:100%;padding:6px 8px;border:1px solid var(--card-bd);border-radius:6px;font-family:var(--font-mono);"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button type="button" onclick="useCurrentLocation()" style="flex:1;padding:8px;border:1px solid var(--card-bd);border-radius:8px;background:var(--field-bg);cursor:pointer;font-size:12px;color:var(--ink);">📍 현재 위치 사용</button>
        <button type="button" onclick="saveSiteSettings()" style="flex:1;padding:8px;border:none;border-radius:8px;background:var(--brand-2);color:#fff;cursor:pointer;font-size:12px;font-weight:700;">저장</button>
      </div>
    </div>
    <div class="out-grid" id="outGrid"><div style="grid-column:1/-1;text-align:center;color:var(--lbl);font-size:12px;padding:20px;">불러오는 중...</div></div>
    <table class="dtable">
      <tr><th>팀명</th><th>출력인원</th><th>체크인 성명</th></tr>
      <tbody id="outTableRows"><tr><td colspan="3" style="text-align:center;color:var(--lbl);">불러오는 중...</td></tr></tbody>
    </table>
    <div style="font-size:11px;color:var(--lbl);margin-top:8px;">작업자 앱의 "출력체크"(GPS 반경 체크인) 기록을 오늘 날짜 기준으로 팀별 집계한 것입니다.</div>
  </div>

  <!-- 작업일보 전체내용 -->
  <div class="admin-pane" id="pane-reports">
    <table class="dtable">
      <tr><th>날짜</th><th>공종</th><th>팀명</th><th>항목수</th><th>PDF</th><th>상태</th></tr>
      <tbody id="reportsRows"><tr><td colspan="6" style="text-align:center;color:var(--lbl);">불러오는 중...</td></tr></tbody>
    </table>
  </div>

  <!-- Check List: TAG NO.×작업분류 그리드. progress_checklist(daily_reports에서 자동 집계됨, report/app/index.html의
       syncProgressChecklist 참고)를 읽기 전용으로 조회만 함 -->
  <div class="admin-pane" id="pane-cl">
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button type="button" class="admin-tab active" id="clSubQtyBtn" onclick="showClSub('qty')">작업수량</button>
      <button type="button" class="admin-tab" id="clSubVolBtn" onclick="showClSub('vol')">작업물량</button>
    </div>
    <div style="overflow-x:auto;">
      <table class="dtable" id="clTable"><tr><td style="text-align:center;color:var(--lbl);padding:20px;">불러오는 중...</td></tr></table>
    </div>
  </div>

  <!-- 회원관리: 팀별로 그룹핑, 리더는 헤더로 표시. 리더 지정/해제·강제탈퇴는 관리자만 -->
  <div class="admin-pane" id="pane-members">
    <div id="membersList"><div style="text-align:center;color:var(--lbl);font-size:12px;padding:20px;">불러오는 중...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
document.getElementById('hdrDate').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'2-digit', day:'2-digit', weekday:'short'});
(function(){
  var p=localStorage.getItem('member_project')||'';
  var c=localStorage.getItem('member_company')||'';
  if(p) document.getElementById('hdrProject').textContent=p;
  if(c) document.getElementById('hdrCompany').textContent=c;
})();
function showAdminTab(btn, key){
  document.querySelectorAll('.admin-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.querySelectorAll('.admin-pane').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('pane-'+key).classList.add('active');
  if(key==='reports') loadAllReports();
  if(key==='members') loadMembers();
  if(key==='cl') loadChecklist();
}

var SUPABASE_URL='https://feymoykefzfwucbrqoja.supabase.co';
var SUPABASE_KEY='sb_publishable_ANT6G7_ka3IPHRk_4vLtBg_7G9NWW7i';
var sbClient = (typeof supabase!=='undefined') ? supabase.createClient(SUPABASE_URL,SUPABASE_KEY) : null;

function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* 계획수량 입력은 웹관리자(admin.html) 전용 — 그 중에서도 PC에서만 가능하게, 모바일에서 admin.html을
   열면(예: 관리자가 폰으로 확인) 다른 화면들과 동일하게 숫자만 보여주고 수정은 막는다. */
var admIsMobile=/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
/* renderProcTable 밖(계획수량 수정 후 재렌더)에서도 써야 해서 loadDashboardData가 채운 값을 보관 */
var dashCatToday={}, dashCatBefore={}, dashCatMenu={}, dashPlanQty={};

/* app_settings.cats_by_menu — 아직 일보 실적이 하나도 없는 분류(예: 계획수량만 미리 잡아두려는 신규
   분류)도 계획수량 설정/엑셀 업로드 대상에 포함시키려고 별도로 읽어온다. report/app/index.html의
   buildPgItems()와 동일한 순서·중복제거 규칙(먼저 나온 공종의 분류명을 기준으로 병합)을 그대로 씀. */
var settingsCatList=[];
async function loadSettingsCatList(){
  if(!sbClient) return;
  try{
    var res = await sbClient.from('app_settings').select('cats_by_menu').eq('id','global').single();
    var catsByMenu = (res.data && res.data.cats_by_menu) || {};
    var seen={}, list=[];
    Object.keys(catsByMenu).forEach(function(m){
      (catsByMenu[m]||[]).forEach(function(cat){
        if(seen[cat]) return;
        seen[cat]=true; list.push(cat);
      });
    });
    settingsCatList=list;
  }catch(e){ console.error('작업분류 목록 불러오기 실패', e); }
}

/* Connection은 규격(FROM/TO)으로 방향을 골라 입력 — 한쪽만 하면 0.5, 양쪽 다 하면 1로 집계
   (report/app/index.html의 동일 함수와 같은 규칙, 이 파일은 별도 스크립트 컨텍스트라 중복 정의). */
function connectionQtyWeight(cat, spec){
  return (cat==='Connection' && (spec==='FROM' || spec==='TO')) ? 0.5 : 1;
}

/* ── 공정률/출력현황 실데이터 집계 — daily_reports(전체 팀·전체 날짜).items/crew + app_settings.plan_qty/personnel ── */
async function loadDashboardData(){
  if(!sbClient) return;
  try{
    var reportsRes = await sbClient.from('daily_reports').select('team,date,items,crew');
    var settingsRes = await sbClient.from('app_settings').select('plan_qty,personnel').eq('id','global').single();
    if(reportsRes.error || !reportsRes.data) return;
    var rows = reportsRes.data;
    var planQty = (settingsRes.data && settingsRes.data.plan_qty) || {};
    var registeredTeams = (settingsRes.data && settingsRes.data.personnel) || [];
    var today = todayStr();

    var catToday={}, catBefore={}, catMenu={};
    var todayCrewByTeam={}, todayNamesByTeam={};
    rows.forEach(function(row){
      var isToday = row.date===today, isBefore = row.date<today;
      if(isToday || isBefore){
        (row.items||[]).forEach(function(it){
          if(!it || !it.cat) return;
          var w = connectionQtyWeight(it.cat, it.spec);
          var q = (Number(it.qty)||0)*w;
          var target = isToday ? catToday : catBefore;
          target[it.cat] = (target[it.cat]||0)+q;
          if(it.menu) catMenu[it.cat]=it.menu;
        });
      }
      if(isToday && row.team){
        var crew = Array.isArray(row.crew) ? row.crew : [];
        if(crew.length){
          todayCrewByTeam[row.team]=crew.length;
          todayNamesByTeam[row.team]=crew.map(function(c){ return c.member_name||'이름없음'; });
        }
      }
    });
    dashCatToday=catToday; dashCatBefore=catBefore; dashCatMenu=catMenu; dashPlanQty=planQty;
    renderProcGrid(catToday,catBefore,catMenu,planQty);
    renderProcTable(catToday,catBefore,planQty);
    renderOutGrid(todayCrewByTeam,registeredTeams);
    renderOutTable(todayCrewByTeam,todayNamesByTeam);
  }catch(e){ console.error('대시보드 데이터 불러오기 실패', e); }
}
function renderProcGrid(catToday,catBefore,catMenu,planQty){
  var MENUS=[{key:'시공',color:'var(--m-시공)'},{key:'품질',color:'var(--m-품질)'},{key:'자재',color:'var(--m-자재)'},{key:'안전',color:'var(--m-안전)'},{key:'화기/유도',color:'var(--m-화기)'}];
  var actual={}, plan={};
  Object.keys(catMenu).forEach(function(cat){
    var m=catMenu[cat];
    actual[m]=(actual[m]||0)+(catToday[cat]||0)+(catBefore[cat]||0);
    plan[m]=(plan[m]||0)+(planQty[cat]||0);
  });
  document.getElementById('procGrid').innerHTML = MENUS.map(function(m){
    var a=actual[m.key]||0, p=plan[m.key]||0;
    var pct = p>0 ? Math.min(100,Math.round(a/p*100)) : 0;
    return '<div class="proc-card"><div class="m" style="color:'+m.color+';">'+m.key+'</div><div class="pct">'+pct+'%</div><div class="proc-bar"><div style="width:'+pct+'%;background:'+m.color+';"></div></div><div class="d">계획 '+p+' / 실적 '+a+'</div></div>';
  }).join('');
}
/* 여기(표/카드)는 항상 보여주기 전용 — 계획수량 수정은 아래 "⚙️ 계획수량 설정" 모달에서만 가능 */
function getCatList(){
  var cats={}, list=[];
  function add(c){ if(!cats[c]){ cats[c]=1; list.push(c); } }
  settingsCatList.forEach(add);
  Object.keys(dashCatToday).forEach(add);
  Object.keys(dashCatBefore).forEach(add);
  Object.keys(dashPlanQty).forEach(add);
  return list;
}
function renderProcTable(catToday,catBefore,planQty){
  var list=getCatList();
  var wrap=document.getElementById('procTableRows');
  if(!list.length){ wrap.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--lbl);">데이터가 아직 없습니다</td></tr>'; return; }
  wrap.innerHTML = list.map(function(cat){
    var before=catBefore[cat]||0, today=catToday[cat]||0, total=before+today, plan=planQty[cat]||0;
    var pct = plan>0 ? Math.min(100,Math.round(total/plan*100)) : 0;
    return '<tr><td>'+cat+'</td><td class="mono">'+(plan||'-')+'</td><td class="mono">'+before+'</td><td class="mono">'+today+'</td><td class="mono">'+total+'</td><td>'+pct+'%</td></tr>';
  }).join('');
}
/* ── 계획수량 설정 모달 — ⚙️ 버튼을 눌러 들어오기 전까지는 수정 진입로가 아예 없다 ── */
function openPlanSettings(){
  var list = getCatList();
  var wrap = document.getElementById('planModalRows');
  wrap.innerHTML = !list.length
    ? '<div style="text-align:center;color:var(--lbl);font-size:13px;padding:14px;">아직 작업분류 데이터가 없습니다.</div>'
    : list.map(function(cat){
        return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--field-bg);">'
          +'<span style="font-size:13px;color:var(--ink);">'+cat+'</span>'
          +'<input type="number" min="0" data-cat="'+cat.replace(/"/g,'&quot;')+'" class="planModalInput" value="'+(dashPlanQty[cat]||'')+'" placeholder="0" style="width:80px;padding:5px 7px;border:1px solid var(--card-bd);border-radius:6px;font-family:var(--font-mono);text-align:right;">'
          +'</div>';
      }).join('');
  document.getElementById('planModalOverlay').style.display='flex';
}
function closePlanSettings(){
  document.getElementById('planModalOverlay').style.display='none';
}
/* 엑셀 일괄 업로드 — "작업분류별_계획수량_업로드서식.xlsx" 형식 전용. 시트 하나 = 작업분류 하나,
   1행은 안내문, 2행은 헤더, 3행부터 데이터. B열(계획수량)만 합산해서 그 분류의 계획수량으로 채운다
   (TAG NO/비고는 여기선 안 쓰고 합계에만 반영 — TAG 단위 계획관리는 별도 논의 전까지 보류).
   여기서는 화면의 입력칸 값만 갱신하고, Supabase 저장은 기존과 동일하게 "저장" 버튼을 눌러야
   반영된다(업로드했다고 확인 없이 바로 저장되지 않게 하려는 의도). */
function handlePlanExcelUpload(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      var knownCats = {}; getCatList().forEach(function(c){ knownCats[c]=1; });
      var matched=[], unmatched=[];
      wb.SheetNames.forEach(function(sheetName){
        if(sheetName==='안내') return;
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1});
        var sum = 0;
        rows.slice(2).forEach(function(r){
          var v = Number(r && r[1]);
          if(!isNaN(v)) sum += v;
        });
        if(!knownCats[sheetName]){ unmatched.push(sheetName); return; }
        if(sum>0) dashPlanQty[sheetName]=sum; else delete dashPlanQty[sheetName];
        matched.push(sheetName+'('+sum+')');
      });
      openPlanSettings();
      var msg = '엑셀 업로드 완료\n\n반영된 분류: '+(matched.length ? matched.length+'개 — '+matched.join(', ') : '없음');
      if(unmatched.length) msg += '\n\n분류명이 일치하지 않아 반영 안 됨:\n'+unmatched.join(', ');
      msg += '\n\n아래 목록에서 확인 후 "저장" 버튼을 눌러야 실제로 반영됩니다.';
      alert(msg);
    }catch(err){
      alert('엑셀 파일을 읽는 중 오류가 발생했습니다: '+(err.message||err));
    }finally{
      input.value='';
    }
  };
  reader.readAsArrayBuffer(file);
}
async function savePlanSettings(){
  document.querySelectorAll('.planModalInput').forEach(function(inp){
    var cat = inp.getAttribute('data-cat');
    var v = Number(inp.value)||0;
    if(v<=0) delete dashPlanQty[cat]; else dashPlanQty[cat]=v;
  });
  renderProcGrid(dashCatToday,dashCatBefore,dashCatMenu,dashPlanQty);
  renderProcTable(dashCatToday,dashCatBefore,dashPlanQty);
  closePlanSettings();
  if(!sbClient) return;
  try{
    var res = await sbClient.from('app_settings').upsert({id:'global', plan_qty:dashPlanQty, updated_at:new Date().toISOString()});
    if(res.error) console.error('계획수량 저장 실패', res.error.message);
  }catch(e){ console.error('계획수량 저장 실패', e); }
}
function renderOutGrid(todayCrewByTeam,registeredTeams){
  var total = Object.keys(todayCrewByTeam).reduce(function(s,t){ return s+todayCrewByTeam[t]; },0);
  var checkedTeams = Object.keys(todayCrewByTeam).length;
  var registeredCount = registeredTeams.length;
  var uncheckedCount = Math.max(0, registeredCount-checkedTeams);
  document.getElementById('outGrid').innerHTML =
    '<div class="out-card"><div class="num">'+total+'</div><div class="lbl">오늘 총 출력인원</div></div>'
    +'<div class="out-card"><div class="num">'+checkedTeams+'</div><div class="lbl">체크인 완료 팀</div></div>'
    +'<div class="out-card"><div class="num">'+registeredCount+'</div><div class="lbl">등록 팀 수</div></div>'
    +'<div class="out-card"><div class="num">'+uncheckedCount+'</div><div class="lbl">미체크 팀</div></div>';
}
function renderOutTable(todayCrewByTeam,todayNamesByTeam){
  var teams=Object.keys(todayCrewByTeam);
  var wrap=document.getElementById('outTableRows');
  if(!teams.length){ wrap.innerHTML='<tr><td colspan="3" style="text-align:center;color:var(--lbl);">오늘 출력체크한 인원이 아직 없습니다</td></tr>'; return; }
  wrap.innerHTML = teams.map(function(t){
    return '<tr><td>'+t+'</td><td class="mono">'+todayCrewByTeam[t]+'</td><td>'+todayNamesByTeam[t].join(', ')+'</td></tr>';
  }).join('');
}

var reportsLoaded = false;
async function loadAllReports(){
  if(reportsLoaded) return; // 관리자가 탭을 다시 눌러도 매번 새로 안 불러옴(간단한 1회 캐시) — 새로고침하면 최신화됨
  var wrap = document.getElementById('reportsRows');
  if(!sbClient){ wrap.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--lbl);">연결 실패</td></tr>'; return; }
  try{
    var res = await sbClient.from('daily_reports').select('*').order('date',{ascending:false});
    if(res.error || !res.data){ wrap.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--lbl);">불러오기 실패</td></tr>'; return; }
    reportsLoaded = true;
    if(!res.data.length){ wrap.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--lbl);">작업일보가 아직 없습니다</td></tr>'; return; }
    wrap.innerHTML = res.data.map(function(r){
      var items = Array.isArray(r.items) ? r.items : [];
      var cats = items.map(function(it){ return it.menu; }).filter(function(v,i,a){ return v && a.indexOf(v)===i; }).join(', ') || '-';
      var isSub = r.status==='submitted';
      return '<tr>'
        +'<td class="mono">'+(r.date||'-')+'</td>'
        +'<td>'+cats+'</td>'
        +'<td>'+(r.team||'-')+'</td>'
        +'<td class="mono">'+items.length+'</td>'
        +'<td>'+(isSub ? '<a class="pill pill-pdf" href="report-pdf.html?id='+encodeURIComponent(r.id)+'" target="_blank">📄 열기</a>' : '<span style="color:var(--lbl);font-size:11px;">-</span>')+'</td>'
        +'<td>'+(isSub ? '<span class="pill pill-ok">제출완료</span>' : '<span class="pill pill-draft">작성중</span>')+'</td>'
      +'</tr>';
    }).join('');
  }catch(e){ wrap.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--lbl);">불러오기 실패</td></tr>'; }
}

/* ── 현장 좌표 설정 — 작업자 앱(index.html)의 출력체크 반경 게이트 기준값 (app_settings.site_lat/site_lng/geofence_m) ── */
async function loadSiteSettings(){
  if(!sbClient) return;
  try{
    var res = await sbClient.from('app_settings').select('site_lat,site_lng,geofence_m').eq('id','global').single();
    if(res.error || !res.data) return;
    if(typeof res.data.site_lat==='number') document.getElementById('siteLatInput').value = res.data.site_lat;
    if(typeof res.data.site_lng==='number') document.getElementById('siteLngInput').value = res.data.site_lng;
    if(typeof res.data.geofence_m==='number') document.getElementById('geofenceInput').value = res.data.geofence_m;
  }catch(e){ console.error('현장 좌표 불러오기 실패', e); }
}
function useCurrentLocation(){
  if(!navigator.geolocation){ alert('이 브라우저는 위치 사용을 지원하지 않습니다.'); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    document.getElementById('siteLatInput').value = pos.coords.latitude;
    document.getElementById('siteLngInput').value = pos.coords.longitude;
  }, function(err){ alert('위치를 가져오지 못했습니다: '+err.message); });
}
async function saveSiteSettings(){
  if(!sbClient){ alert('Supabase 연결 실패'); return; }
  var lat = Number(document.getElementById('siteLatInput').value);
  var lng = Number(document.getElementById('siteLngInput').value);
  var geo = Number(document.getElementById('geofenceInput').value) || 1000;
  if(!lat || !lng){ alert('위도/경도를 입력해주세요.'); return; }
  try{
    var res = await sbClient.from('app_settings').upsert({id:'global', site_lat:lat, site_lng:lng, geofence_m:geo, updated_at:new Date().toISOString()});
    if(res.error){ alert('저장 실패: '+res.error.message); return; }
    alert('현장 좌표가 저장되었습니다.');
  }catch(e){ alert('저장 실패: '+e.message); }
}

/* ── 회원관리: members를 team으로 그룹핑, is_leader=true인 사람을 헤더로 ──
   is_leader 컬럼이 아직 없으면 select('*')는 에러 없이 그냥 undefined로 오므로
   전원이 "리더 없음" 상태로 조용히 표시됨(컬럼 추가 전에도 안전하게 동작). */
var membersLoaded=false, lastMembers=[];
async function loadMembers(){
  if(membersLoaded) return;
  var wrap=document.getElementById('membersList');
  if(!sbClient){ wrap.innerHTML='<div style="text-align:center;color:var(--lbl);font-size:12px;padding:20px;">연결 실패</div>'; return; }
  try{
    var res=await sbClient.from('members').select('*').order('team').order('name');
    if(res.error||!res.data){ wrap.innerHTML='<div style="text-align:center;color:var(--lbl);font-size:12px;padding:20px;">불러오기 실패</div>'; return; }
    membersLoaded=true;
    lastMembers=res.data;
    renderMembers();
  }catch(e){ wrap.innerHTML='<div style="text-align:center;color:var(--lbl);font-size:12px;padding:20px;">불러오기 실패</div>'; }
}
function memberRowHtml(m,isLeader){
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--field-bg);">'
    +'<span style="font-size:14px;'+(isLeader?'font-weight:800;color:var(--brand-2);':'color:var(--ink);')+'">'+(isLeader?'👑 ':'')+m.name+'</span>'
    +'<div style="display:flex;gap:6px;">'
    +'<button type="button" class="memberLeaderBtn" data-id="'+m.id+'" data-cur="'+(isLeader?'1':'0')+'" style="border:1px solid var(--card-bd);background:var(--field-bg);color:var(--brand-2);border-radius:6px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;">'+(isLeader?'리더 해제':'리더 지정')+'</button>'
    +'<button type="button" class="memberDelBtn" data-id="'+m.id+'" style="border:1px solid rgba(231,76,60,0.5);background:rgba(231,76,60,0.1);color:#E74C3C;border-radius:6px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;">탈퇴</button>'
    +'</div></div>';
}
function renderMembers(){
  var wrap=document.getElementById('membersList');
  if(!lastMembers.length){ wrap.innerHTML='<div style="text-align:center;color:var(--lbl);font-size:12px;padding:20px;">등록된 회원이 없습니다</div>'; return; }
  var byTeam={};
  lastMembers.forEach(function(m){ var t=m.team||'미지정'; (byTeam[t]=byTeam[t]||[]).push(m); });
  var html='';
  Object.keys(byTeam).forEach(function(team){
    var members=byTeam[team];
    var leader=members.find(function(m){ return m.is_leader; });
    var rest=members.filter(function(m){ return m!==leader; });
    html+='<div style="background:var(--card);border:1px solid var(--card-bd);border-radius:10px;padding:14px;margin-bottom:12px;">';
    html+='<div style="font-size:13px;font-weight:800;color:var(--brand-1);">'+team+'</div>';
    if(leader) html+=memberRowHtml(leader,true);
    rest.forEach(function(m){ html+=memberRowHtml(m,false); });
    html+='</div>';
  });
  wrap.innerHTML=html;
}
document.getElementById('membersList').addEventListener('click', async function(e){
  var leaderBtn=e.target.closest('.memberLeaderBtn');
  if(leaderBtn){
    var id=leaderBtn.getAttribute('data-id'), cur=leaderBtn.getAttribute('data-cur')==='1';
    var row=lastMembers.find(function(m){ return String(m.id)===String(id); });
    if(!row) return;
    try{
      if(!cur && row.team){
        var prevLeader=lastMembers.find(function(m){ return m.team===row.team && m.is_leader && String(m.id)!==String(id); });
        if(prevLeader){
          var r0=await sbClient.from('members').update({is_leader:false}).eq('id',prevLeader.id);
          if(r0.error){ alert('리더 설정 실패: '+r0.error.message); return; }
        }
      }
      var res=await sbClient.from('members').update({is_leader:!cur}).eq('id',id);
      if(res.error){ alert('리더 설정 실패: '+res.error.message); return; }
    }catch(err){ alert('리더 설정 실패: '+(err.message||err)); return; }
    membersLoaded=false; loadMembers();
    return;
  }
  var delBtn=e.target.closest('.memberDelBtn');
  if(delBtn){
    var id2=delBtn.getAttribute('data-id');
    var row2=lastMembers.find(function(m){ return String(m.id)===String(id2); });
    if(!row2) return;
    if(!confirm(row2.name+' 님을 강제 탈퇴시키겠습니까?')) return;
    try{
      var res2=await sbClient.from('members').delete().eq('id',id2);
      if(res2.error){ alert('탈퇴 처리 실패: '+res2.error.message); return; }
    }catch(err2){ alert('탈퇴 처리 실패: '+(err2.message||err2)); return; }
    membersLoaded=false; loadMembers();
  }
});

/* ── Check List: TAG NO.×작업분류 그리드, 읽기 전용 — progress_checklist를 그대로 보여줌.
   가로축(작업분류)은 별도 동기화 없이 실제 존재하는 cat 값에서 뽑아서 항상 일보와 일치함. */
var clSub='qty', clRows=[];
async function loadChecklist(){
  var wrap=document.getElementById('clTable');
  if(!sbClient){ wrap.innerHTML='<tr><td style="text-align:center;color:var(--lbl);padding:20px;">연결 실패</td></tr>'; return; }
  try{
    var res=await sbClient.from('progress_checklist').select('*').order('tag');
    if(res.error||!res.data){ wrap.innerHTML='<tr><td style="text-align:center;color:var(--lbl);padding:20px;">불러오기 실패(progress_checklist 테이블이 아직 없을 수 있음)</td></tr>'; return; }
    clRows=res.data;
    renderChecklist();
  }catch(e){ wrap.innerHTML='<tr><td style="text-align:center;color:var(--lbl);padding:20px;">불러오기 실패</td></tr>'; }
}
function renderChecklist(){
  var wrap=document.getElementById('clTable');
  if(!clRows.length){ wrap.innerHTML='<tr><td style="text-align:center;color:var(--lbl);padding:20px;">아직 데이터가 없습니다(일보에 입력하면 자동으로 채워집니다)</td></tr>'; return; }
  var cats=[], tags=[], byTagCat={};
  clRows.forEach(function(r){
    if(cats.indexOf(r.cat)===-1) cats.push(r.cat);
    if(tags.indexOf(r.tag)===-1) tags.push(r.tag);
    byTagCat[r.tag+'|'+r.cat]=r;
  });
  var thead='<tr><th>TAG NO.</th>'+cats.map(function(c){ return '<th>'+c+'</th>'; }).join('')+'</tr>';
  var body=tags.map(function(t){
    var cells=cats.map(function(c){
      var r=byTagCat[t+'|'+c];
      var val = r ? (clSub==='qty' ? (r.complete_date||'') : (r.qty_total||'')) : '';
      return '<td>'+(val ? (clSub==='qty' ? '<span class="pill pill-ok">'+val+'</span>' : val) : '<span style="color:var(--card-bd);">-</span>')+'</td>';
    }).join('');
    return '<tr><td class="mono">'+t+'</td>'+cells+'</tr>';
  }).join('');
  wrap.innerHTML=thead+body;
}
function showClSub(sub){
  clSub=sub;
  document.getElementById('clSubQtyBtn').classList.toggle('active',sub==='qty');
  document.getElementById('clSubVolBtn').classList.toggle('active',sub==='vol');
  renderChecklist();
}
</script>
